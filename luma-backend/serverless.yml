# "org" ensures this Service is used with the correct Serverless Framework License Key.
org: brownginger12
# "service" is the name of this project. This will also be added to your AWS resource names.
service: luma-backend

custom:
  wsgi:
    app: app.app
  pythonRequirements:
    dockerizePip: true
  prune:
    automatic: true       
    includeLayers: true   
    number: 1  
  

provider:
  name: aws
  runtime: python3.12
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - events:PutEvents
            - s3:PutObject
            - s3:PutObjectAcl
          Resource:
            - arn:aws:dynamodb:us-east-2:272898481162:table/luma-customer-accounts
            - arn:aws:dynamodb:us-east-2:272898481162:table/luma-employee-accounts
            - arn:aws:dynamodb:us-east-2:272898481162:table/luma-rooms
            - arn:aws:dynamodb:us-east-2:272898481162:table/luma-events
            - arn:aws:dynamodb:us-east-2:272898481162:table/luma-package
            - arn:aws:dynamodb:us-east-2:272898481162:table/luma-room-reviews
            - arn:aws:dynamodb:us-east-2:272898481162:table/luma-room-reviews/index/room_id-index
            - arn:aws:dynamodb:us-east-2:272898481162:table/luma-reservation-transaction
            - arn:aws:events:us-east-2:272898481162:event-bus/luma-event-bus
            - arn:aws:s3:::luma-resources
            - arn:aws:s3:::luma-resources/*


  environment:
    USERS_TABLE: luma-customer-accounts
    EMPLOYEES_TABLE: luma-employee-accounts
  

package:
  exclude:
    - venv/**
    - node_modules/**

functions:
  api:
    handler: wsgi_handler.handler
    events:
      - http:
          path: /
          method: ANY
      - http:
          path: /{proxy+}
          method: ANY

  room_date_change:
    handler: Handler.room_handler.update_room_dates
    events:
      - eventBridge:
          eventBus: arn:aws:events:us-east-2:272898481162:event-bus/luma-event-bus
          pattern:
            source:
              - api-events
            detail-type:
              - transaction_update_room_dates
  
  room_date_change_onfailure:
    handler: Handler.transaction_handler.delete_transaction_event
    events:
      - eventBridge:
          eventBus: arn:aws:events:us-east-2:272898481162:event-bus/luma-event-bus
          pattern:
            source:
              - api-events
            detail-type:
              - transaction_on_failure
  
  roomImageUpload:
    handler: Handler.room_handler.update_room_image
    events:
      - eventBridge:
          eventBus: arn:aws:events:us-east-2:272898481162:event-bus/luma-event-bus
          pattern:
            source:
              - api-events
            detail-type:
              - room_image_upload

  userImageUpload:
    handler: Handler.User_Handler.update_user_image
    events:
      - eventBridge:
          eventBus: arn:aws:events:us-east-2:272898481162:event-bus/luma-event-bus
          pattern:
            source:
              - api-events
            detail-type:
              - user_image_upload

  employeeImageUpload:
    handler: Handler.Employee_Handler.update_user_image
    events:
      - eventBridge:
          eventBus: arn:aws:events:us-east-2:272898481162:event-bus/luma-event-bus
          pattern:
            source:
              - api-events
            detail-type:
              - employee_image_upload

plugins:
  - serverless-wsgi
  - serverless-python-requirements
  - serverless-prune-plugin