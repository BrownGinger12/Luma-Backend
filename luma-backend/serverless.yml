# "org" ensures this Service is used with the correct Serverless Framework License Key.
org: brownginger12
# "service" is the name of this project. This will also be added to your AWS resource names.
service: luma-backend

custom:
  wsgi:
    app: app.app
  pythonRequirements:
    dockerizePip: true

provider:
  name: aws
  runtime: python3.12
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - arn:aws:dynamodb:us-east-2:272898481162:table/luma-customer-accounts
  environment:
    USERS_TABLE: luma-customer-accounts
  

package:
  exclude:
    - venv/**
    - node_modules/**

functions:
  api:
    handler: wsgi_handler.handler
    events:
      - http:
          path: /
          method: ANY
      - http:
          path: /{proxy+}
          method: ANY

plugins:
  - serverless-wsgi
  - serverless-python-requirements