org: ${env:ORG_NAME}
service: ${env:SERVICE_NAME}

custom:
  wsgi:
    app: ${env:WSGI_APP}
  pythonRequirements:
    dockerizePip: true
  prune:
    automatic: true
    includeLayers: true
    number: 1

provider:
  name: aws
  runtime: ${env:PYTHON_RUNTIME}
  region: ${env:AWS_REGION}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - events:PutEvents
            - s3:PutObject
            - s3:PutObjectAcl
          Resource:
            - ${env:DYNAMODB_CUSTOMER_TABLE_ARN}
            - ${env:DYNAMODB_EMPLOYEE_TABLE_ARN}
            - ${env:DYNAMODB_ROOMS_TABLE_ARN}
            - ${env:DYNAMODB_EVENTS_TABLE_ARN}
            - ${env:DYNAMODB_PACKAGE_TABLE_ARN}
            - ${env:DYNAMODB_ROOM_REVIEWS_TABLE_ARN}
            - ${env:DYNAMODB_ROOM_REVIEWS_ROOM_INDEX_ARN}
            - ${env:DYNAMODB_ROOM_REVIEWS_USER_INDEX_ARN}
            - ${env:DYNAMODB_RESERVATION_TABLE_ARN}
            - ${env:DYNAMODB_RESERVATION_USER_INDEX_ARN}
            - ${env:EVENTBRIDGE_BUS_ARN}
            - ${env:S3_BUCKET_ARN}
            - ${env:S3_BUCKET_OBJECTS_ARN}

  environment:
    USERS_TABLE: ${env:USERS_TABLE}
    EMPLOYEES_TABLE: ${env:EMPLOYEES_TABLE}
    EVENT_BUS_NAME: ${env:EVENT_BUS_NAME}
    S3_BUCKET_NAME: ${env:S3_BUCKET_NAME}

package:
  exclude:
    - venv/**
    - node_modules/**

functions:
  api:
    handler: wsgi_handler.handler
    events:
      - http:
          path: /
          method: ANY
      - http:
          path: /{proxy+}
          method: ANY

  room_date_change:
    handler: Handler.room_handler.update_room_dates
    events:
      - eventBridge:
          eventBus: ${env:EVENTBRIDGE_BUS_ARN}
          pattern:
            source:
              - ${env:EVENT_SOURCE}
            detail-type:
              - transaction_update_room_dates

  room_date_change_onfailure:
    handler: Handler.transaction_handler.delete_transaction_event
    events:
      - eventBridge:
          eventBus: ${env:EVENTBRIDGE_BUS_ARN}
          pattern:
            source:
              - ${env:EVENT_SOURCE}
            detail-type:
              - transaction_on_failure

  roomImageUpload:
    handler: Handler.room_handler.update_room_image
    events:
      - eventBridge:
          eventBus: ${env:EVENTBRIDGE_BUS_ARN}
          pattern:
            source:
              - ${env:EVENT_SOURCE}
            detail-type:
              - room_image_upload

  userImageUpload:
    handler: Handler.User_Handler.update_user_image
    events:
      - eventBridge:
          eventBus: ${env:EVENTBRIDGE_BUS_ARN}
          pattern:
            source:
              - ${env:EVENT_SOURCE}
            detail-type:
              - user_image_upload

  employeeImageUpload:
    handler: Handler.Employee_Handler.update_user_image
    events:
      - eventBridge:
          eventBus: ${env:EVENTBRIDGE_BUS_ARN}
          pattern:
            source:
              - ${env:EVENT_SOURCE}
            detail-type:
              - employee_image_upload

plugins:
  - serverless-wsgi
  - serverless-python-requirements
  - serverless-prune-plugin
